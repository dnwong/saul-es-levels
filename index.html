<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ES Key Levels — Saul Shaoul</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>ES Key Levels</h1>
      <p class="subtitle">Saul Shaoul Methodology</p>
    </header>

    <!-- TOP BAR -->
    <div class="top-bar">
      <label class="sym-label">Symbol
        <input type="text" id="symbol-input" value="ES=F" />
      </label>
      <button id="fetch-btn" class="btn-accent">⬇ Fetch Data</button>
      <button id="calc-btn" class="btn-primary">Calculate Levels</button>
      <button id="clear-btn" class="btn-ghost">Clear</button>
      <span id="fetch-status" class="status"></span>
    </div>

    <div class="main-grid">
      <!-- LEFT: INPUTS -->
      <aside class="input-panel">

        <!-- PIVOT SECTION — auto-filled from TwelveData, editable -->
        <div class="section pivot-section">
          <div class="section-title">Floor Pivot
            <span class="section-note">auto-filled · override if needed</span>
          </div>
          <div class="field-row">
            <label>H <input type="number" id="pivot-h" step="1" placeholder="—" /></label>
            <label>L <input type="number" id="pivot-l" step="1" placeholder="—" /></label>
            <label>C <input type="number" id="pivot-c" step="1" placeholder="—" /></label>
          </div>
          <div id="pivot-preview" class="pivot-preview"></div>
        </div>

        <!-- MULTI-TIMEFRAME — auto-filled -->
        <div class="section">
          <div class="section-title">Multi-Timeframe
            <span class="section-note auto-note" id="auto-badge">auto-filled</span>
          </div>

          <div class="tf-row">
            <span class="tf-label">Year</span>
            <label>H <input type="number" id="year-high" step="1" /></label>
            <label>L <input type="number" id="year-low"  step="1" /></label>
          </div>
          <div class="tf-row">
            <span class="tf-label">Quarter</span>
            <label>H <input type="number" id="quarter-high" step="1" /></label>
            <label>L <input type="number" id="quarter-low"  step="1" /></label>
          </div>
          <div class="tf-row">
            <span class="tf-label">Month</span>
            <label>H <input type="number" id="month-high" step="1" /></label>
            <label>L <input type="number" id="month-low"  step="1" /></label>
          </div>
          <div class="tf-row">
            <span class="tf-label">Week</span>
            <label>H <input type="number" id="week-high" step="1" /></label>
            <label>L <input type="number" id="week-low"  step="1" /></label>
          </div>
          <div class="tf-row">
            <span class="tf-label">Prev Day</span>
            <label>H <input type="number" id="pd-high"  step="1" /></label>
            <label>L <input type="number" id="pd-low"   step="1" /></label>
          </div>
          <div class="tf-row">
            <span class="tf-label">Overnight</span>
            <label>H <input type="number" id="on-high" step="1" /></label>
            <label>L <input type="number" id="on-low"  step="1" /></label>
          </div>
        </div>

        <!-- SETTINGS -->
        <div class="section">
          <div class="section-title">Settings</div>
          <div class="field-row">
            <label>Max levels
              <input type="number" id="max-levels" value="15" min="5" max="30" step="1" />
            </label>
            <label>Confluence (pts)
              <input type="number" id="conf-window" value="2" min="0" step="1" />
            </label>
          </div>
        </div>

      </aside>

      <!-- RIGHT: OUTPUT -->
      <main class="output-panel">
        <div id="bias-bar" class="bias-bar hidden"></div>
        <div id="levels-out">
          <p class="placeholder">Fetch data, enter pivot H·L·C, then Calculate.</p>
        </div>
      </main>
    </div>
  </div>

  <script src="fetcher.js"></script>
  <script src="calculator.js"></script>
</body>
</html>
