name: Build & Push Docker Image

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/saul-es-levels:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/saul-es-levels:${{ github.sha }}

      - name: Trigger Portainer redeploy
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK }}
        run: |
          if [ -n "$WEBHOOK" ]; then
            curl -s -X POST "$WEBHOOK" --max-time 10 || echo "Webhook unreachable (Portainer may be on local network)"
          else
            echo "No PORTAINER_WEBHOOK secret set, skipping"
          fi
